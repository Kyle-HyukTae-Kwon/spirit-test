<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캠퍼스 정령 테스트</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #2b2a28;
    --muted: #6f6a63;
    --accent: #5b8c6a;
    --accent-soft: #e4efe6;
    --line: #e5e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    /* 한글을 글자 단위가 아닌 단어(띄어쓰기) 단위로 줄바꿈 */
    word-break: keep-all;
    overflow-wrap: break-word;
    text-wrap: pretty;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 480px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 24px;
  }
  h1 { font-size: 2rem; margin: 0 0 12px; line-height: 1.3; }
  h2 { font-size: 1.3rem; margin: 0 0 20px; line-height: 1.4; }
  h3 { font-size: 1rem; margin: 20px 0 6px; color: var(--accent); }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  /* 가운데 정렬 글은 줄 길이를 고르게 */
  .center h1, .center h2, .center p, h2 { text-wrap: balance; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 14px;
  }
  .primary {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .primary:hover { filter: brightness(1.05); }
  .start-emoji { font-size: 3.5rem; margin-bottom: 12px; }

  /* 질문 화면 */
  .progress-bar {
    height: 8px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .3s;
  }
  .progress-text { margin: 8px 0 20px; font-size: .9rem; color: var(--muted); }
  .answers { display: grid; gap: 10px; }
  .answer {
    text-align: left;
    padding: 14px 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 1rem;
    white-space: pre-line; /* 답 문장 속 \n 자리에서 줄바꿈 */
  }
  .answer:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* 결과 화면 */
  figure { margin: 0 0 20px; }
  .picture {
    width: 100%;
    max-width: 300px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-radius: 16px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 4.5rem;
  }
  .picture img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { margin-top: 6px; font-size: .75rem; color: var(--muted); }
  .result-label { font-size: .9rem; color: var(--muted); }
  .result-name { font-size: 1.8rem; margin: 4px 0 8px; }
  ul { margin: 0; padding-left: 20px; }
  #careful { white-space: pre-line; }
  .note { margin-top: 24px; font-size: .85rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>

  <!-- 첫 화면 -->
  <section id="start" class="screen active">
    <div class="card center">
      <div class="start-emoji">🌱</div>
      <h1>캠퍼스 정령 테스트</h1>
      <p class="muted">수강신청부터 종강까지, 내 속마음으로 알아보는 나와 닮은 캠퍼스 정령</p>
      <button class="primary" id="start-btn">시작</button>
    </div>
  </section>

  <!-- 질문 화면 -->
  <section id="quiz" class="screen">
    <div class="card">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="progress-text" id="progress-text">질문 1 / 6</p>
      <h2 id="question"></h2>
      <div class="answers" id="answers"></div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="screen">
    <div class="card">
      <div class="center">
        <figure>
          <div class="picture" id="picture"></div>
          <figcaption id="ai-caption">AI로 만든 이미지</figcaption>
        </figure>
        <p class="result-label">나와 닮은 캠퍼스 정령은</p>
        <h1 class="result-name" id="name"></h1>
        <p id="oneline"></p>
      </div>
      <h3>사는 곳</h3>
      <p id="home"></p>
      <h3>잘하는 것</h3>
      <ul id="good"></ul>
      <h3>조심할 것</h3>
      <p id="careful"></p>
      <h3>잘 맞는 정령</h3>
      <p id="match"></p>
      <button class="primary" id="retry-btn">다시 하기</button>
      <p class="note">재미로 보는 테스트예요.<br>우리는 모두 여러&nbsp;정령의 모습을 조금씩 갖고 있어요 🌱</p>
    </div>
  </section>

</main>

// (긴 말부터 처리해야 "마음이 무거워질 때가"처럼 겹치는 말도 통째로 붙는다)
const KEEP_SORTED = KEEP_TOGETHER.slice().sort((a, b) => b.length - a.length);
function keep(text) {
  return KEEP_SORTED.reduce(
    (t, phrase) => t.split(phrase).join(phrase.replace(/ /g, " ")),
    text
  );
}

function show(screenId) {

// 배열을 무작위로 섞은 새 배열 (Fisher–Yates)
function shuffle(list) {
  const arr = list.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  current = 0;
  picks = [];
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  const item = QUESTIONS[current];
  $("progress-text").textContent = `질문 ${current + 1} / ${QUESTIONS.length}`;
  $("progress-fill").style.width = `${(current / QUESTIONS.length) * 100}%`;
  $("question").textContent = keep(`Q${current + 1}. ${item.q}`);

  const box = $("answers");
  box.innerHTML = "";
  // 답 순서는 매번 섞는다
  shuffle(item.a).forEach(([text, spirit]) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = `"${keep(text)}"`;
    btn.addEventListener("click", () => choose(spirit));
    box.appendChild(btn);
  });
}

function choose(spirit) {
  picks[current] = spirit;
  current++;
  if (current < QUESTIONS.length) {
    renderQuestion();
  } else {
    $("progress-fill").style.width = "100%";
    showResult(decide(picks));
  }
}

// 가장 많이 고른 정령이 결과. 동점이면 TIE_ORDER 순서로 문항을 보고
// 동점 정령 중 하나를 고른 첫 번째 답의 정령으로 정한다.
function decide(answers) {
  const count = {};
  answers.forEach((s) => { count[s] = (count[s] || 0) + 1; });
  const max = Math.max(...Object.values(count));
  const top = Object.keys(count).filter((s) => count[s] === max);
  if (top.length === 1) return top[0];
  for (const qi of TIE_ORDER) {
    if (top.includes(answers[qi])) return answers[qi];
  }
}

function showResult(key) {
  const s = SPIRITS[key];
  const mate = SPIRITS[s.match];

  // 그림: images_spirit-<key>.png, 아직 없으면 이모지로 대신 표시
  const pic = $("picture");
  pic.innerHTML = "";
  const caption = $("ai-caption");
  caption.hidden = false;
  const img = new Image();
  img.alt = s.alt;
  img.onerror = () => { pic.textContent = s.emoji; caption.hidden = true; };
  img.src = `images_spirit-${key}.png`;
  pic.appendChild(img);

  $("name").textContent = `${s.emoji} ${s.name}`;
  $("oneline").textContent = keep(s.oneline);
  // 사는 곳: 장소 이름 한 줄 + 그 아래 "- 설명" 한 줄
  $("home").innerHTML = `<strong>${s.home[0]}</strong><br>- ${keep(s.home[1])}`;
  $("good").innerHTML = s.good.map((g) => `<li>${keep(g)}</li>`).join("");
  // 조심할 것: 문장마다 줄바꿈
  $("careful").textContent = keep(s.careful).replace(/([.!?]) /g, "$1\n");
  $("match").innerHTML = `<strong>${mate.emoji} ${mate.name}</strong> — ${keep(s.matchWhy)}`;
  show("result");
}

$("start-btn").addEventListener("click", startQuiz);
$("retry-btn").addEventListener("click", () => show("start"));
</script>
